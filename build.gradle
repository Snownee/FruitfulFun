plugins {
    id 'java-library'
    id 'org.relativitymc.neo-loom' version "${neo_loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

version = "mc${archive_minecraft_version}-NeoForge-${mod_version}"
group = project.maven_group
var realVersion = project.mod_version + '+neoforge'

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.neoforged.net/releases" }
    maven {
        url "https://maven.sinytra.org"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url = "https://mvn.devos.one/snapshots/"
    }
    // Trinkets
    maven {
        name = "Nucleoid"
        url = 'https://maven.nucleoid.xyz/releases'
    }
    // Farmer's Delight Refabricated
    maven {
        name = "Greenhouse Maven"
        url = 'https://maven.greenhouse.lgbt/releases/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir { dir 'libs' }
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.classtweaker")

    runs {
        client {
            client()
            property 'mixin.debug.export', 'true'
            property 'mixin.debug.verbose', 'true'
            property 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            property 'mixin.debug.export', 'true'
            property 'mixin.debug.verbose', 'true'
            property 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            environment 'gameTestServer'
            property 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

// Include resources generated by data generators.
sourceSets {
    main.resources.srcDirs += "src/generated/resources"
    // Datagen code is not compiled; JSONs generated by the Fabric branch are used as-is.
    // Note: snownee.fruits.gadget.datagen.SetBuzzyPowerFunction is runtime code (a loot function), so it is kept.
    main.java.exclude "snownee/fruits/datagen/**"
    main.java.exclude "snownee/fruits/cherry/datagen/**"
    main.java.exclude "snownee/fruits/food/datagen/**"
    main.java.exclude "snownee/fruits/gadget/datagen/GadgetBlockLoot.java"
    main.java.exclude "snownee/fruits/gadget/datagen/package-info.java"
    main.java.exclude "snownee/fruits/pomegranate/datagen/**"
    main.java.exclude "snownee/fruits/compat/farmersdelight/FarmersDelightBlockLoot.java"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    forgeUserdev "net.neoforged:neoforge:${project.neo_version}:userdev"

    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.fabric_version}"
    neoForgeInterfaceInjections "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.fabric_version}"
    implementation "org.sinytra.launchpad:launchpad:${project.launchpad_version}"
    implementation "org.sinytra:connector:${project.connector_version}"

    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
    implementation "maven.modrinth:cloth-config:${project.cloth_config_version}+neoforge"
    implementation "maven.modrinth:kiwi:${project.kiwi_version}+neoforge"
    annotationProcessor "maven.modrinth:kiwi:${project.kiwi_version}+neoforge"
    implementation "maven.modrinth:lychee:${project.lychee_version}+neoforge"

    implementation "maven.modrinth:jade:${project.jade_version}+neoforge"
    implementation "me.shedaniel:RoughlyEnoughItems-neoforge:${project.rei_version}"
    compileOnly "me.shedaniel:REIPluginCompatibilities-forge-annotations:12.+"

    implementation "mezz.jei:jei-${project.jei_minecraft_version}-common-api:${project.jei_version}"
    implementation "mezz.jei:jei-${project.jei_minecraft_version}-neoforge-api:${project.jei_version}"
    implementation "mezz.jei:jei-${project.jei_minecraft_version}-neoforge:${project.jei_version}"

    implementation "eu.pb4:trinkets:${project.trinkets_version}"

    implementation("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }

    implementation fileTree(dir: "libs", include: ["*.jar"])
    annotationProcessor fileTree(dir: "libs", include: ["*.jar"])

    implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.WARN
    inputs.property "version", realVersion
    inputs.property "neo_version_range", project.neo_version_range
    inputs.property "minecraft_version_range", project.minecraft_version_range

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "file": ["jarVersion": realVersion],
                "neo_version_range": project.neo_version_range,
                "minecraft_version_range": project.minecraft_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs.add("-Akiwi.useDataModule")
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude "/assets/${project.mod_id}/lang/en_us.existing.yaml"
    exclude "/assets/${project.mod_id}/textures/entity/bee/ref"
    exclude "/assets/${project.mod_id}/textures/ref"
    exclude '**/*.bat'
    exclude '**/*.psd'
    exclude '**/*.aseprite'
    exclude '**/*.py'
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("neoforge")
    displayName = "[NeoForge ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "355467"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1")
        minecraftVersions.add("26.1.1")
        requires("kiwi")
        requires("lychee")
        requires("forgified-fabric-api")
        requires("launchpad")
        optional("jade")
    }
//    modrinth {
//        projectId = "4bZDWNlG"
//        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
//        minecraftVersions.add(minecraft_version)
//        minecraftVersions.add("26.1")
//        minecraftVersions.add("26.1.1")
//        requires("kiwi")
//        requires("lychee")
//        requires("forgified-fabric-api")
//        requires("launchpad")
//        optional("jade")
//    }
}
