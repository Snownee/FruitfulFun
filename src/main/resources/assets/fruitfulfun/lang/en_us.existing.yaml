  cause the new leaves to disappear immediately after the bees have finished
  pollinating them. For a better experience, it is recommended to set the
  "Unknown leaves only match self" option in the Leaves Us In Peace's
  configuration to "No". This message will be displayed only once.
tip.fruitfulfun.brainierBees: >-
  Fruitful Fun detected that you have Brainier Bees installed, which replaces the
  bee AI system. This will prevent new bee features added by Fruitful Fun from functioning.
  You can uninstall the mod or disable the bee module in the configuration.
  This message will be displayed only once.
