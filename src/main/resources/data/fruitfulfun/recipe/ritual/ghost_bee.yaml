  type: execute
- delay 0.5
- command: particle fruitfulfun:ghost ~ ~ ~ 0.75 0.1 0.75 0 4
  hide: true
  type: execute
- delay 0.5
- command: particle fruitfulfun:ghost ~ ~ ~ 0.75 0.1 0.75 0 4
  hide: true
  type: execute
type: fruitfulfun:dragon_ritual
